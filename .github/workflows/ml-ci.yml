
name: Student Result ML Continuous Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Check model quality
        run: python quality_gate.py

      - name: Run API tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs student-result-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "attendance": 90,
              "internal_marks": 85,
              "assignment_marks": 88,
              "previous_score": 80
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "attendance": 90,
              "internal_marks": 85,
              "assignment_marks": 88,
              "previous_score": 80
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'
      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container

      - name: Cleanup Docker container
        if: always()
        run: |
          docker stop student-result-ml-container || true
          docker rm student-result-ml-container || true

          

      - name: Prepare release package
        run: |
          mkdir release_candidate
          cp app.py requirements.txt student_result_model.pkl metrics.json release_candidate/
          echo "Run the application using python app.py" > release_candidate/DEPLOYMENT.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          retention-days: 7
